# Local development.
#   docker compose up -d db         -> just Postgres (run the app from IntelliJ / ./gradlew bootRun)
#   docker compose up --build       -> Postgres + the API in Docker
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mychecklist
      POSTGRES_USER: mychecklist
      POSTGRES_PASSWORD: mychecklist   # local only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mychecklist -d mychecklist"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/mychecklist
      DB_USERNAME: mychecklist
      DB_PASSWORD: mychecklist
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-your-firebase-project-id}
      APP_SUPER_ADMIN_EMAILS: ${APP_SUPER_ADMIN_EMAILS:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
