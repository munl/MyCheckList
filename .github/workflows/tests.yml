# Runs the full test suite on every pull request and on every push to main.
# The "Tests" job is the check that must pass before a PR can be merged.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run that's still going.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle downloads between runs.
      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers starts Postgres in Docker, which the Ubuntu runner already has.
      - name: Run tests
        run: ./gradlew test

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7
