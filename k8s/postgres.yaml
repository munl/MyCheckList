# Postgres for the LOCAL Kubernetes cluster only.
# Online, you'll use a managed database (e.g. Neon) instead and delete this file from kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: mychecklist
type: Opaque
stringData:
  POSTGRES_DB: mychecklist
  POSTGRES_USER: mychecklist
  POSTGRES_PASSWORD: mychecklist  # local only
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mychecklist
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mychecklist
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
