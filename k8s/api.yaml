apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: mychecklist
data:
  DB_URL: jdbc:postgresql://postgres:5432/mychecklist
  FIREBASE_PROJECT_ID: your-firebase-project-id   # <-- change me
  APP_SUPER_ADMIN_EMAILS: ""                       # <-- your Google account email
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mychecklist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: mychecklist-api:dev
          imagePullPolicy: IfNotPresent  # use the image you built locally
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30   # allow up to ~150s for Spring Boot + Flyway to start
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mychecklist
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080   # reach it at http://localhost:30080
